<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    background: #000010;
    display: flex; align-items: center; justify-content: center;
  }
  .badge {
    width: 260px; height: 260px;
    display: flex; align-items: center; justify-content: center;
    filter:
      drop-shadow(0 0 8px rgba(0, 229, 245, 0.8))
      drop-shadow(0 0 22px rgba(0, 180, 200, 0.55))
      drop-shadow(0 0 50px rgba(0, 229, 245, 0.3));
  }
  .badge img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="badge">
    <img src="/delta-gold-nobg.png" />
  </div>
</body>
</html>

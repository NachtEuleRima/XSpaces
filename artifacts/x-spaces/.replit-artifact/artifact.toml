kind = "web"
previewPath = "/"
title = "X Spaces Lightshow"
version = "1.0.0"
id = "artifacts/x-spaces"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23998

[services.development]
run = "pnpm --filter @workspace/x-spaces run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/x-spaces", "run", "build" ]
publicDir = "artifacts/x-spaces/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23998"
BASE_PATH = "/"
